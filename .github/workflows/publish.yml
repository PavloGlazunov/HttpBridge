name: Publish

# Push a tag like v1.2.3 to publish all packages with version 1.2.3 to nuget.org.
# Auth: nuget.org Trusted Publishing (OIDC), no long-lived API key. Needs a trusted publishing policy on nuget.org
# and the repository secret NUGET_USER (nuget.org profile name, not the email).
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets NuGet/login exchange the GitHub OIDC token for a short-lived API key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: dotnet build HttpBridge.slnx -c Release -p:Version=$VERSION
      - run: dotnet test HttpBridge.slnx -c Release --no-build
      - run: dotnet pack HttpBridge.slnx -c Release --no-build -p:Version=$VERSION -o artifacts
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate
